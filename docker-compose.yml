services:
  netguard:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    volumes: ["netguard-data:/data"]
    environment:
      TRUST_PROXY: "1"     # set when behind nginx/Caddy/Cloudflare so rate limits see real client IPs
      # ALLOW_SIGNUP: "0"  # disable open registration after you create your account
volumes:
  netguard-data:
